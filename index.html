<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maya · Before the Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#07060c; --paper:#f1eefb; --fog:#9d97b3;
  --violet:#662AF4; --rose:#C4527A; --ultra:#2D0BD5;
  --line:rgba(241,238,251,.16);
  --display:'Archivo',system-ui,sans-serif;
  --sans:'Space Grotesk',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
@media(pointer:fine){ body{cursor:none} body button,body textarea,body input{cursor:none} }

#bg{position:fixed;inset:0;z-index:0}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.5;mix-blend-mode:overlay}

#cursor{position:fixed;z-index:90;width:18px;height:18px;border:1px solid var(--paper);border-radius:50%;
  pointer-events:none;transform:translate(-50%,-50%);transition:width .25s,height .25s,opacity .3s;opacity:0}
#cursor.on{opacity:.9}#cursor.hov{width:40px;height:40px;border-color:var(--rose)}
#cursor i{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;background:var(--paper);transform:translate(-50%,-50%)}
@media(pointer:coarse){#cursor{display:none}}

#progress{position:fixed;top:0;left:0;height:2px;z-index:80;width:0%;
  background:linear-gradient(90deg,var(--ultra),var(--violet),var(--rose));transition:width .8s cubic-bezier(.7,0,.2,1)}

/* top fade mask: content can never visually collide with the orb */
#topfade{position:fixed;top:0;left:0;right:0;height:170px;z-index:50;pointer-events:none;
  background:linear-gradient(to bottom,#07060c 38%,rgba(7,6,12,0))}

/* ---- the agent orb ---- */
#orbwrap{position:fixed;top:36px;left:50%;transform:translateX(-50%);z-index:60;text-align:center;
  transition:transform .8s cubic-bezier(.2,.8,.2,1),top .8s}
#orb{width:84px;height:84px;display:block;margin:0 auto}
#orbname{margin-top:5px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--fog);
  opacity:0;transition:opacity 1s .5s;font-weight:600;white-space:nowrap}
#orbname.show{opacity:1}
#orbname b{color:var(--rose)}

/* ---- single-question stage ---- */
#stage{position:fixed;inset:0;z-index:10;display:flex;overflow-y:auto;scrollbar-width:none;
  padding:180px 24px 56px;-webkit-overflow-scrolling:touch}
#stage::-webkit-scrollbar{display:none}
.scene{width:100%;max-width:680px;margin:auto;display:flex;flex-direction:column;gap:8px;
  opacity:0;transform:translateY(48px);transition:opacity .55s,transform .55s cubic-bezier(.2,.8,.2,1)}
.scene.in{opacity:1;transform:none}
.scene.out{opacity:0;transform:translateY(-48px);transition:opacity .45s,transform .45s cubic-bezier(.6,0,.8,.4)}

.qtag{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--fog);font-weight:600;margin-bottom:12px}
.qtag b{color:var(--rose)}
.title{font-family:var(--display);font-weight:800;font-size:clamp(27px,4.4vw,47px);
  line-height:1.06;letter-spacing:-.02em}
.title .a{color:var(--rose)}
.title .grad{background:linear-gradient(100deg,#8f5bff,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.small{font-size:15px;font-weight:300;color:var(--fog);line-height:1.6;margin-top:10px;max-width:56ch}
.small b{font-weight:500;color:var(--paper)}

.controls{margin-top:26px}
.controls.gone{opacity:0;transform:translateY(-8px);pointer-events:none}
.hintline{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--fog);font-weight:600;margin-bottom:14px}
.hintline:empty{display:none}
.chipset{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:10px}
.chipset.single{display:flex}
.chip{border:1px solid var(--line);background:rgba(241,238,251,.05);color:var(--paper);
  font-family:var(--sans);font-size:14.5px;font-weight:500;padding:13px 18px;border-radius:14px;
  transition:.22s;opacity:0;transform:translateY(10px);text-align:left;width:100%}
.chip.in{opacity:1;transform:none}
.chip:hover{border-color:var(--rose);transform:translateY(-2px);background:rgba(196,82,122,.1)}
.chip.picked{border-color:var(--violet);background:rgba(102,42,244,.22)}
.chip.begin{background:var(--paper);color:var(--ink);font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;font-size:13px;padding:17px 34px;border-radius:99px;width:auto}
.chip.begin:hover{box-shadow:0 8px 40px rgba(196,82,122,.4)}
.chip.go{border-color:var(--rose);color:var(--rose);font-weight:600}

/* full-scene feedback moment */
.reacttag{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--fog);font-weight:600;margin-bottom:16px}
.reacttag b{color:var(--rose)}
.reactbig{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,46px);
  line-height:1.12;letter-spacing:-.02em;color:var(--paper)}
.reactbig .r{color:var(--rose)}

/* action row: opt-out on the left, Done on the right */
.actionrow{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:22px;
  padding-top:20px;border-top:1px solid var(--line);opacity:0;transform:translateY(8px);transition:.4s}
.actionrow.in{opacity:1;transform:none}
.optout{background:none;border:1px dashed rgba(157,151,179,.45);color:var(--fog);
  font-family:var(--sans);font-size:13.5px;font-weight:400;padding:12px 20px;border-radius:99px;transition:.22s}
.optout:hover{border-color:var(--rose);border-style:solid;color:var(--paper)}
.optout.picked{border-style:solid;border-color:var(--violet);background:rgba(102,42,244,.2);color:var(--paper)}
.donebtn{margin-left:auto;background:var(--paper);color:var(--ink);border:none;border-radius:99px;
  font-family:var(--sans);font-weight:700;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:15px 30px;transition:.25s;opacity:.28;pointer-events:none}
.donebtn.ready{opacity:1;pointer-events:auto}
.donebtn.ready:hover{box-shadow:0 8px 34px rgba(196,82,122,.45);transform:translateY(-2px)}
@media(max-width:640px){.donebtn{margin-left:0;width:100%}}

.typedblock{display:flex;gap:10px}
.typedblock textarea{flex:1;background:rgba(241,238,251,.05);border:1px solid var(--line);border-radius:14px;
  color:var(--paper);font-family:var(--sans);font-weight:400;font-size:15.5px;padding:15px 17px;outline:none;resize:none;height:84px}
.typedblock textarea:focus{border-color:var(--violet)}
.typedblock textarea::placeholder{color:rgba(157,151,179,.5)}
.typedblock button{align-self:flex-end;background:var(--paper);color:var(--ink);border:none;border-radius:99px;
  font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:15px 24px;transition:.25s}
.typedblock button:hover{box-shadow:0 8px 30px rgba(196,82,122,.4)}

.react{margin-top:30px;font-family:var(--display);font-weight:700;font-size:clamp(19px,2.6vw,25px);
  line-height:1.25;letter-spacing:-.01em;color:var(--rose);
  opacity:0;transform:translateY(10px);transition:.45s}
.react.show{opacity:1;transform:none}

/* ---- briefing ---- */
.brief{position:relative;border-radius:20px;padding:1.5px;margin-top:26px;
  background:conic-gradient(from var(--a,0deg),var(--ultra),var(--violet),var(--rose),var(--ultra));animation:spin 5s linear infinite}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.brief .in2{border-radius:19px;background:rgba(12,10,22,.9);backdrop-filter:blur(16px);padding:34px 32px}
.brief .lbl{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--fog);font-weight:600}
.brief .lvl{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.6vw,42px);line-height:1.02;
  letter-spacing:-.02em;margin:10px 0 6px;
  background:linear-gradient(100deg,var(--paper),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.brief .tag{font-size:13.5px;color:var(--fog);font-weight:300;margin-bottom:16px;line-height:1.5}
.brief h4{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--rose);margin:18px 0 8px;font-weight:700}
.brief p,.brief li{font-size:14.5px;font-weight:300;line-height:1.65;color:var(--paper)}
.brief p b,.brief li b{font-weight:600}
.brief ol{margin-left:18px;display:flex;flex-direction:column;gap:8px}
#status{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--fog);margin-top:16px;font-weight:600}
.copybtn{margin-top:18px;background:var(--paper);color:var(--ink);border:none;border-radius:99px;
  font-family:var(--sans);font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:13px 24px;transition:.25s}
.copybtn:hover{box-shadow:0 8px 30px rgba(196,82,122,.4)}
.flagcard{margin-top:20px;border:1px solid rgba(196,82,122,.5);background:rgba(196,82,122,.09);
  border-radius:14px;padding:18px 20px}
.flaghead{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--rose);
  font-weight:700;margin-bottom:8px}
.flagcard p{font-size:14px;line-height:1.6;font-weight:300}
#status.ok{color:#7fd6a4}
#fallback{display:none;margin-top:10px}
#fallback code{display:block;background:rgba(241,238,251,.05);border:1px dashed var(--line);border-radius:10px;
  padding:12px;font-size:11px;word-break:break-all;color:var(--fog);margin-top:8px}
#fallback button{background:none;border:none;color:var(--fog);font-family:var(--sans);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;margin-top:8px;text-decoration:underline;text-underline-offset:4px;font-weight:600}
.closing{margin-top:26px;font-family:var(--display);font-weight:700;font-size:clamp(19px,2.6vw,24px);line-height:1.3;letter-spacing:-.01em}
.closing .grad{background:linear-gradient(100deg,#8f5bff,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:640px){#stage{padding-top:160px}#topfade{height:150px}.title{font-size:29px}}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="grain"></canvas>
<div id="cursor"><i></i></div>
<div id="progress"></div>
<div id="topfade"></div>

<div id="orbwrap">
  <canvas id="orb" width="168" height="168"></canvas>
  <div id="orbname"></div>
</div>

<div id="stage"></div>

<script>
/* ============================================================
   CONFIG
   ============================================================ */
const WEBHOOK_URL = "PASTE_YOUR_APPS_SCRIPT_URL_HERE";
const AGENT_NAME  = "Maya";
const OWNER_NAME  = "Dhanish";

/* ---------------- state ---------------- */
const S={tier:null,q1:null,q1i:0,q2:[],q3:[],q4:[],q4i:0,q5:"",level:0,start:Date.now()};

/* ---------------- background blobs ---------------- */
const bg=document.getElementById('bg'),bx=bg.getContext('2d');
let W,H,energy=.3,mx=innerWidth/2,my=innerHeight/2,vx=0,vy=0,lx=mx,ly=my;
const COLS=['#662AF4','#C4527A','#2D0BD5','#8b3df0'];
const blobs=Array.from({length:7},(_,i)=>({x:Math.random(),y:Math.random(),r:.18+Math.random()*.22,
  c:COLS[i%COLS.length],sp:.4+Math.random()*.8,ph:Math.random()*6.28,ph2:Math.random()*6.28}));
function sizeBG(){W=bg.width=innerWidth*devicePixelRatio;H=bg.height=innerHeight*devicePixelRatio;
  bg.style.width=innerWidth+'px';bg.style.height=innerHeight+'px'}
sizeBG();addEventListener('resize',sizeBG);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let t0=performance.now();
(function paint(now){
  const t=(now-t0)/1000;
  bx.fillStyle='#07060c';bx.fillRect(0,0,W,H);bx.globalCompositeOperation='screen';
  vx+=((mx-lx)*devicePixelRatio-vx)*.08;vy+=((my-ly)*devicePixelRatio-vy)*.08;lx=mx;ly=my;
  const drift=Math.hypot(vx,vy);
  blobs.forEach(b=>{
    const sp=b.sp*(.35+energy*1.3)*(reduced?.15:1);
    const px=(b.x+Math.sin(t*sp*.21+b.ph)*.22+Math.cos(t*sp*.13+b.ph2)*.14)*W;
    const py=(b.y+Math.cos(t*sp*.17+b.ph2)*.22+Math.sin(t*sp*.11+b.ph)*.14)*H;
    const pull=1/(1+Math.hypot(px-mx*devicePixelRatio,py-my*devicePixelRatio)/(W*.25));
    const jx=px+vx*pull*2.2,jy=py+vy*pull*2.2;
    const r=b.r*Math.min(W,H)*(1+energy*.5+pull*drift*.0006);
    const g=bx.createRadialGradient(jx,jy,0,jx,jy,r);
    g.addColorStop(0,b.c+'cc');g.addColorStop(1,b.c+'00');
    bx.globalAlpha=.15+energy*.28;bx.fillStyle=g;bx.beginPath();bx.arc(jx,jy,r,0,7);bx.fill();
  });
  bx.globalAlpha=1;bx.globalCompositeOperation='source-over';
  requestAnimationFrame(paint);
})(t0);

/* grain */
const gr=document.getElementById('grain'),gx=gr.getContext('2d');
function grain(){gr.width=innerWidth/2;gr.height=innerHeight/2;gr.style.width=innerWidth+'px';gr.style.height=innerHeight+'px';
  const d=gx.createImageData(gr.width,gr.height);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=14}
  gx.putImageData(d,0,0)}
grain();addEventListener('resize',grain);

/* cursor */
const cur=document.getElementById('cursor');let cx=mx,cy=my,shown=false;
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;if(!shown){cur.classList.add('on');shown=true}});
(function cl(){cx+=(mx-cx)*.28;cy+=(my-cy)*.28;cur.style.left=cx+'px';cur.style.top=cy+'px';requestAnimationFrame(cl)})();
addEventListener('mouseover',e=>{if(e.target.closest('button,textarea,input'))cur.classList.add('hov')});
addEventListener('mouseout',()=>cur.classList.remove('hov'));

/* ---------------- the agent orb ---------------- */
document.getElementById('orbname').innerHTML='<b>'+AGENT_NAME+'</b> · '+OWNER_NAME+"'s agent · active";
const orb=document.getElementById('orb'),ox=orb.getContext('2d');
const OC=84,targets=[];
for(let i=0;i<46;i++){const a=i/46*6.283;targets.push({x:OC+Math.cos(a)*57,y:OC+Math.sin(a)*57,s:2.1})}
for(let i=0;i<28;i++){const a=i/28*6.283+.3;targets.push({x:OC+Math.cos(a)*35,y:OC+Math.sin(a)*35,s:2.6})}
for(let i=0;i<18;i++){const a=Math.random()*6.283,r=Math.random()*13;targets.push({x:OC+Math.cos(a)*r,y:OC+Math.sin(a)*r,s:3.1})}
const parts=targets.map(t=>({x:OC+(Math.random()-.5)*420,y:OC+(Math.random()-.5)*420,vx:0,vy:0,t}));
let orbState='assembling',orbPulse=0,orbT=0,onOrbReady=null;
(function orbLoop(){
  orbT+=.016;ox.clearRect(0,0,168,168);
  const breathe=orbState==='talking'?1+Math.sin(orbT*9)*.06:1+Math.sin(orbT*1.6)*.025;
  orbPulse+=((orbState==='talking'?1:0)-orbPulse)*.08;
  let settled=0;
  parts.forEach((p,i)=>{
    const spin=orbT*(orbState==='thinking'?1.1:.25);
    const ring=i<46?57:(i<74?35:0);
    let tx,ty;
    if(ring>0){const baseA=Math.atan2(p.t.y-OC,p.t.x-OC)+spin*(ring===57?1:-1.4);
      tx=OC+Math.cos(baseA)*ring*breathe;ty=OC+Math.sin(baseA)*ring*breathe}
    else{tx=OC+(p.t.x-OC)*breathe;ty=OC+(p.t.y-OC)*breathe}
    p.vx+=(tx-p.x)*.055;p.vy+=(ty-p.y)*.055;p.vx*=.86;p.vy*=.86;p.x+=p.vx;p.y+=p.vy;
    if(Math.hypot(tx-p.x,ty-p.y)<3)settled++;
    const hue=i%3;const col=hue===0?'#8f5bff':hue===1?'#C4527A':'#5a48ff';
    ox.globalAlpha=.55+orbPulse*.4;
    ox.fillStyle=col;ox.beginPath();ox.arc(p.x,p.y,p.t.s*(1+orbPulse*.35),0,7);ox.fill();
  });
  if(orbState==='assembling'&&settled>targets.length*.92){orbState='idle';
    document.getElementById('orbname').classList.add('show');
    if(onOrbReady){onOrbReady();onOrbReady=null}}
  const g=ox.createRadialGradient(OC,OC,0,OC,OC,27);
  g.addColorStop(0,'rgba(196,82,122,'+(0.25+orbPulse*.3)+')');g.addColorStop(1,'rgba(196,82,122,0)');
  ox.globalAlpha=1;ox.fillStyle=g;ox.beginPath();ox.arc(OC,OC,27,0,7);ox.fill();
  requestAnimationFrame(orbLoop);
})();
orb.style.width='84px';orb.style.height='84px';

/* ---------------- single-question scene engine ---------------- */
const stage=document.getElementById('stage');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function makeScene(html){
  const sc=document.createElement('div');sc.className='scene';sc.innerHTML=html;
  stage.appendChild(sc);stage.scrollTop=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>sc.classList.add('in')));
  return sc;
}
async function retireScene(sc){
  sc.classList.remove('in');sc.classList.add('out');
  await sleep(460);sc.remove();
}

/* one full question step: question scene in, answer, question out,
   reaction as its own full scene, hold, out */
async function step({qtag=null,title,small=null,hint='',options=null,multi=false,exclusive=null,minPick=1,
                     typed=false,placeholder='',react=null,reactHold=2400}){
  const sc=makeScene(
    (qtag?`<div class="qtag">${qtag}</div>`:'')+
    `<div class="title">${title}</div>`+
    (small?`<div class="small">${small}</div>`:'')+
    `<div class="controls"><div class="hintline">${hint}</div>`+
    (typed
      ?`<div class="typedblock"><textarea maxlength="240" placeholder="${placeholder}"></textarea><button>Send →</button></div>`
      :`<div class="chipset"></div>`)+
    `</div>`
  );
  let answer;

  if(typed){
    const ta=sc.querySelector('textarea');
    await sleep(500);ta.focus();
    answer=await new Promise(res=>{
      const send=()=>{const v=ta.value.trim();if(!v)return;res(v)};
      sc.querySelector('.typedblock button').addEventListener('click',send);
      ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
    });
  }else{
    const set=sc.querySelector('.chipset');
    if(options.length===1)set.classList.add('single');
    answer=await new Promise(res=>{
      const picked=new Set();
      options.forEach((op,i)=>{
        const c=document.createElement('button');c.className='chip'+(options.length===1?' begin':'');
        c.textContent=op;set.appendChild(c);
        setTimeout(()=>c.classList.add('in'),110+55*i);
        c.addEventListener('click',()=>{
          if(!multi){c.classList.add('picked');res({value:op,index:i});return}
          if(picked.has(op)){picked.delete(op);c.classList.remove('picked')}
          else{picked.add(op);c.classList.add('picked')}
          if(outBtn&&picked.size){outBtn.classList.remove('picked');optedOut=false}
          sync();
        });
      });

      let outBtn=null,doneBtn=null,optedOut=false;
      const sync=()=>{
        const ok=optedOut||picked.size>=minPick;
        if(doneBtn)doneBtn.classList.toggle('ready',ok);
      };
      if(multi){
        const row=document.createElement('div');row.className='actionrow';
        if(exclusive){
          outBtn=document.createElement('button');outBtn.className='optout';outBtn.textContent=exclusive;
          outBtn.addEventListener('click',()=>{
            optedOut=!optedOut;outBtn.classList.toggle('picked',optedOut);
            if(optedOut){picked.clear();[...set.children].forEach(x=>x.classList.remove('picked'))}
            sync();
          });
          row.appendChild(outBtn);
        }
        doneBtn=document.createElement('button');doneBtn.className='donebtn';doneBtn.textContent='Done →';
        doneBtn.addEventListener('click',()=>{
          if(optedOut)res({values:[exclusive]});else res({values:[...picked]});
        });
        row.appendChild(doneBtn);
        sc.querySelector('.controls').appendChild(row);
        setTimeout(()=>row.classList.add('in'),110+55*options.length);
      }
    });
  }

  /* let the picked chip register visually, then retire the question */
  await sleep(300);
  await retireScene(sc);

  /* the feedback takes the whole stage */
  const reactText=typeof react==='function'?react(answer):react;
  if(reactText){
    orbState='talking';
    const rs=makeScene(
      `<div class="reacttag"><b>${AGENT_NAME}</b></div>`+
      `<div class="reactbig">${reactText}</div>`
    );
    await sleep(reactHold);
    orbState='idle';
    await retireScene(rs);
  }
  return answer;
}
function setProgress(n){document.getElementById('progress').style.width=(n*100/7)+'%';energy=Math.min(1,.3+n*.1)}

/* ---------------- content ---------------- */
const TIERS=["Associate","Consultant","Project Leader","Principal / Partner","MDP"];
const TIER_R={
  "Associate":"An Associate. Calibrating: least to unlearn, most to gain.",
  "Consultant":"A Consultant. Calibrating for peak hours-per-deliverable territory.",
  "Project Leader":"A Project Leader. You review everything, so this compounds. Calibrating.",
  "Principal / Partner":"Principal or Partner. Your hours cost the most. Calibrating.",
  "MDP":"An MDP. Calibrating, and on my best behaviour."
};
const Q1_OPTS=[
  "I ask questions, copy answers into my work",
  "I use it for a specific task or two, nothing systematic",
  "I use Projects, custom instructions, or upload files",
  "I run parallel chats and reuse my own prompt systems",
  "I've built something others on my team now use",
  "I've connected real tools (Zoom, Outlook...) or built Skills",
  "Honestly, barely touched it"
];
const Q1_R=[
  "The most common starting point. You won't stay there long.",
  "A toehold. We'll turn that into something systematic.",
  "Ahead of most already. My job now is to pull you into heavier work.",
  "Impressive. You're closer to agentic than you think.",
  "You've already crossed from user to builder. Noted.",
  "Edge of the map. Flagging you for the advanced segments.",
  "A clean slate. Zero bad habits to unlearn, honestly the fastest group to teach."
];
const Q1_LEVEL=[0,0,1,2,2,3,0];

const Q2_EX="Nothing yet, that's why I'm here";
const Q2_OPTS=[
  "Summarising docs and transcripts",
  "Research and synthesis",
  "Building end-to-end decks, not just slides",
  "Financial models or scenario analysis",
  "Turning messy data into insights",
  "Agents that run a workflow start to finish",
  "Redlining and reviewing documents",
  "Building a tool my team now uses",
  "Writing code or small automations",
  "Wired into my real tools (Zoom, Outlook, Drive...)",
  "Client-ready charts and visuals",
  "Second-opinion on my own thinking or analysis"
];
const Q3_EX="I don't even know what these mean, honestly";
const Q3_OPTS=[
  "Projects","Skills","Connectors","Artifacts","MCP",
  "Claude Code","Cowork","Subagents","Context engineering",
  "Model routing","Evals","Human-in-the-loop"
];
const Q4_OPTS=[
  "A mini tool for an everyday problem",
  "A daily habit, AI woven into my routine",
  "A core casework engine: research, analysis, decks",
  "A workflow wired into my real tools (Zoom, Outlook...)",
  "A Skill that compounds, smarter every week",
  "An agent that runs on its own, I just review",
  "Something my whole team can use, not just me"
];
const Q4_INTENSITY=[0,0,1,2,2,3,2];
/* internal only, for the response sheet. Never shown to the participant. */
const INTERNAL=["Foundations","Momentum","Power user","Frontier"];
/* the honest read, shown instead of any track or tag */
const FEEDBACK=[
  "You're going to get a lot out of this. "+OWNER_NAME+" builds the session so the fundamentals land properly rather than rushing past them, and you'll leave having made something yourself. Come curious, and bring the questions you've been too busy to ask.",
  "You've got a real base to build on. "+OWNER_NAME+" will pitch the room so the early ground moves quickly for people like you, and the depth arrives sooner. Expect the middle stretch to be where your week starts changing.",
  "You're well ahead of the average starting point. "+OWNER_NAME+" tailors the depth to the room, so with people at your level in it, the session pushes further into the harder material. Expect to be challenged, and expect the people around you to learn from what's on your screen.",
  "You're at the front edge of the room. "+OWNER_NAME+" adapts the session to the level in front of him, so expect the advanced material to go deeper and faster than it otherwise would. Come with your hardest problem, and be ready to be a lighthouse for your table."
];
const FEEDBACK_NOTE="Nothing here is assigned to you. Everyone starts the session together. This just helps "+OWNER_NAME+" shape the room around who's actually in it.";
/* the same setup checklist for everybody */
const CHECKLIST=[
  "Install the <b>Claude Desktop app</b> from claude.ai/download (Mac or Windows).",
  "Sign in with your <b>work account / SSO</b>, not a personal one.",
  "Open a chat and ask it anything, just to confirm your access works.",
  "Find the <b>Cowork tab</b> in the desktop app and open it once.",
  "Find the <b>Code tab</b> (Claude Code) and open it once. No terminal needed, it's built in.",
  "In Settings, open <b>Connectors</b> and connect one tool you actually use (Zoom or Outlook). About 30 seconds.",
  "Install the <b>Claude mobile app</b> and sign in with the same account."
];
const CHECKLIST_PLAIN="Workshop prep checklist\n"+
  "1. Install the Claude Desktop app from claude.ai/download\n"+
  "2. Sign in with your work account / SSO\n"+
  "3. Open a chat, ask anything, confirm access works\n"+
  "4. Open the Cowork tab once\n"+
  "5. Open the Code tab (Claude Code) once\n"+
  "6. Settings > Connectors: connect one tool (Zoom or Outlook)\n"+
  "7. Install the Claude mobile app, same account\n\n"+
  "Heads up: the first time you open Claude Code it may ask you to install extras "+
  "(Python, Git, command line tools) or to sign in to GitHub. Say yes and finish all of it "+
  "before the session. It only happens once, and it is the single most common reason "+
  "people lose the first 20 minutes.";

/* ---------------- the flow ---------------- */
async function flow(){
  /* intro */
  await step({
    title:`Hello. I'm <span class="a">${AGENT_NAME}</span>,<br>${OWNER_NAME}'s agent.`,
    small:OWNER_NAME+" is buried in casework right now, so I'm setting up the <b>AI Fluency workshop</b> for him.",
    options:["Begin →"]
  });
  setProgress(1);

  await step({
    title:`First, where do you <span class="a">sit?</span>`,
    options:TIERS,
    react:a=>{S.tier=a.value;return TIER_R[a.value]}
  });
  setProgress(2);

  await step({
    qtag:"<b>01</b> / 05 · starting point",
    title:`Where do you actually <span class="a">live</span> with AI today?`,
    options:Q1_OPTS,
    react:a=>{S.q1=a.value;S.q1i=a.index;return Q1_R[a.index]}
  });
  setProgress(3);

  await step({
    qtag:"<b>02</b> / 05 · use cases",
    title:`What has AI actually <span class="a">done for you</span> at work?`,
    hint:"Tap all that apply",
    options:Q2_OPTS,multi:true,exclusive:Q2_EX,
    react:a=>{S.q2=a.values;
      const adv=["Building end-to-end decks, not just slides","Financial models or scenario analysis",
        "Turning messy data into insights","Agents that run a workflow start to finish",
        "Redlining and reviewing documents","Building a tool my team now uses",
        "Writing code or small automations","Wired into my real tools (Zoom, Outlook, Drive...)",
        "Client-ready charts and visuals"].filter(x=>S.q2.includes(x)).length;
      const n=S.q2.includes(Q2_EX)?0:S.q2.length;
      return n===0?"Perfect. By hour one, that list stops being empty."
        :adv===0?"The classics. Now we go past what most people ever try."
        :adv<=2?"Some real range there. We'll push the advanced side further."
        :"You're already deep. So we go where chat can't follow."}
  });
  setProgress(4);

  await step({
    qtag:"<b>03</b> / 05 · vocabulary",
    title:`Which of these could you <span class="a">explain to a colleague?</span>`,
    hint:"Tap what you genuinely know",
    options:Q3_OPTS,multi:true,exclusive:Q3_EX,
    react:a=>{S.q3=a.values;
      const v=S.q3.includes(Q3_EX)?0:S.q3.length;
      return v===0?"Respect for the honesty. That vocabulary is half the superpower, and you'll have it by the break."
        :v<=3?"A start. The rest is exactly what the middle of the session installs."
        :v<=7?"Solidly fluent. Noting you for the deeper track."
        :"You could probably teach this. I'm telling "+OWNER_NAME+"."}
  });
  setProgress(5);

  await step({
    qtag:"<b>04</b> / 05 · your build",
    title:`In the build hour, what do you want to <span class="a">walk out holding?</span>`,
    hint:"Pick two or three",
    options:Q4_OPTS,multi:true,minPick:2,
    react:a=>{S.q4=a.values;
      const maxI=Math.max(...S.q4.map(x=>Q4_INTENSITY[Q4_OPTS.indexOf(x)]));S.q4i=maxI;
      return maxI<=0?"Habits and mini tools. Underrated, and exactly where daily hours hide."
        :maxI===1?"Core casework it is. The engine room."
        :maxI===2?"Connected and compounding. This is where real time comes back."
        :"Ambitious. I'm telling "+OWNER_NAME+" to bring the good stuff."}
  });
  setProgress(6);

  await step({
    qtag:"<b>05</b> / 05 · the open door",
    title:`Name one thing that genuinely <span class="a">frustrates you</span>, that you wish AI could just do.`,
    small:"Timesheets. Expense reports. Formatting decks at midnight. Chasing people for inputs. Anything, in your own words.",
    hint:"One line · Enter to send",typed:true,
    placeholder:"The thing that steals your evenings...",
    react:a=>{S.q5=a;return "Filed. The most common frustrations become the live builds in the room."}
  });
  setProgress(7);

  /* the read + the prep card */
  const lvl=Q1_LEVEL[S.q1i];
  const vocabN=S.q3.includes(Q3_EX)?0:S.q3.length;
  const eff=Math.min(3,Math.max(lvl,(vocabN>=6?lvl+1:lvl),(S.q4i>=3?Math.max(lvl,2):lvl)));
  S.level=eff;
  makeScene(`
    <div class="qtag">Compiled by ${AGENT_NAME}</div>
    <div class="title">Read this. Then <span class="grad">save the card.</span></div>
    <div class="brief" style="margin-top:22px"><div class="in2">
      <div class="lbl">How ${AGENT_NAME} is setting the room for you</div>
      <p style="margin-top:12px">${FEEDBACK[eff]}</p>
      <p style="margin-top:12px;color:var(--fog);font-size:13.5px">${FEEDBACK_NOTE}</p>
    </div></div>
    <div class="brief" style="margin-top:18px"><div class="in2">
      <div class="lbl">Before the workshop · the 10-minute setup</div>
      <p style="margin-top:10px;color:var(--fog);font-size:13.5px">Same list for everyone. Do it before the day so zero workshop minutes go to installs. Screenshot this card, or copy it into your task list.</p>
      <ol style="margin-top:14px">${CHECKLIST.map(p=>`<li>${p}</li>`).join('')}</ol>
      <div class="flagcard">
        <div class="flaghead">Important · first time opening Claude Code</div>
        <p>It may ask you to install extras (Python, Git, command line tools) or to sign in to GitHub. <b>Say yes and finish all of it before the session.</b> It only happens once, and it's the single most common reason people lose their first twenty minutes.</p>
      </div>
      <button id="copylist" class="copybtn">Copy checklist</button>
      <div id="status">Logging your response...</div>
      <div id="fallback"><p style="font-size:12.5px;color:var(--fog)">Network blocked the drop-box. Paste this code back to the organiser instead:</p>
      <code id="fbcode"></code><button id="copyfb">Copy code</button></div>
    </div></div>
    <div class="closing">Show up with the list done, and the whole session is building, not setup.<br><span class="grad">See you in the room.</span></div>
  `);
  document.getElementById('copylist').addEventListener('click',()=>{
    navigator.clipboard.writeText(CHECKLIST_PLAIN);
    document.getElementById('copylist').textContent='Copied ✓';
    setTimeout(()=>{document.getElementById('copylist').textContent='Copy checklist'},2500);
  });
  document.getElementById('orbwrap').classList.add('docked');
  submit();
}

/* ---------------- submit ---------------- */
async function submit(){
  const payload={tier:S.tier,q1_level_claim:S.q1,q2_usecases:S.q2,q3_vocab:S.q3,
    q4_build_goal:(S.q4||[]).join(', '),q5_delegate:S.q5,assigned_level:INTERNAL[S.level],
    seconds:Math.round((Date.now()-S.start)/1000)};
  const st=document.getElementById('status');
  if(!WEBHOOK_URL||WEBHOOK_URL.startsWith('PASTE')){fallback(payload,st);return}
  try{
    await fetch(WEBHOOK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},
      body:JSON.stringify(payload)});
    st.textContent='Response logged ✓';st.classList.add('ok');
  }catch(e){fallback(payload,st)}
}
function fallback(payload,st){
  st.textContent="Couldn't reach the drop-box";
  const fb=document.getElementById('fallback');fb.style.display='block';
  const code=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  document.getElementById('fbcode').textContent=code;
  document.getElementById('copyfb').onclick=()=>{navigator.clipboard.writeText(code);
    document.getElementById('copyfb').textContent='Copied ✓'};
}

/* ---------------- boot ---------------- */
onOrbReady=()=>setTimeout(flow,300);
</script>
</body>
</html>
